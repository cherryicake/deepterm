name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            artifact: deepterm-macos
          - os: ubuntu-22.04
            name: Linux
            artifact: deepterm-linux
          - os: windows-latest
            name: Windows
            artifact: deepterm-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Verify release version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME 与 Cargo.toml 中的版本 $version 不一致"
            exit 1
          fi
          for file in scripts/build-dmg.sh scripts/build-deb.sh windows/deepterm.iss; do
            if ! grep -q "$version" "$file"; then
              echo "::error file=$file::打包脚本中的版本没有同步到 $version"
              exit 1
            fi
          done

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libclang-dev \
            libfontconfig-dev libfreetype-dev libncurses-dev ncurses-bin \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-xkb-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev libvulkan1 libdbus-1-dev \
            libssl-dev libzstd-dev libasound2-dev

      - name: Prepare macOS packaging tools
        if: runner.os == 'macOS'
        run: |
          command -v cargo-bundle >/dev/null || cargo install cargo-bundle --locked

          # Xcode 27 起 Metal Toolchain 需要单独下载；装上后再编译 GPUI 的 shader。
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "Metal Toolchain 未安装，尝试下载..."
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Prepare Windows packaging tools
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: |
          chmod +x scripts/build-dmg.sh
          ./scripts/build-dmg.sh
          mkdir -p dist
          cp DeepTerm-*-macOS.dmg dist/

      - name: Build Linux .deb
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh
          mkdir -p dist
          cp target/deb-out/*.deb dist/

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release --bin deepterm

          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" |
            Select-Object -First 1
          if (-not $iscc) { throw "找不到 Inno Setup 的 ISCC.exe" }
          & $iscc.FullName windows\deepterm.iss

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\bundle\DeepTerm-*-setup.exe dist\

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  core:
    name: Core ${{ matrix.archive }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            archive: deepcore-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: deepcore-linux-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential musl-tools pkg-config clang libclang-dev \
            libfontconfig-dev libfreetype-dev libncurses-dev ncurses-bin \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-xkb-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev libvulkan1 libdbus-1-dev \
            libssl-dev libzstd-dev libasound2-dev

      - name: Build static deepcore
        shell: bash
        run: |
          target_env=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          musl_self="$(rustc --print sysroot)/lib/rustlib/${{ matrix.target }}/lib/self-contained"
          printf '%s\n' '#!/bin/sh' "exec musl-gcc -L\"$musl_self\" \"\$@\"" \
            > /tmp/deepterm-musl-linker
          chmod +x /tmp/deepterm-musl-linker
          export "CARGO_TARGET_${target_env}_LINKER=/tmp/deepterm-musl-linker"
          export "CC_${target_env}=musl-gcc"
          export PKG_CONFIG_ALLOW_CROSS=1
          export RUST_FONTCONFIG_DLOPEN=1
          cargo build --release --locked --bin deepcore --target "${{ matrix.target }}"

          binary="target/${{ matrix.target }}/release/deepcore"
          strip --strip-all "$binary"
          file "$binary"
          if readelf -d "$binary" 2>&1 | grep -q 'NEEDED'; then
            echo "::error::${{ matrix.target }} 的 deepcore 仍是动态链接，不能作为远端发布包"
            readelf -d "$binary" | grep NEEDED
            exit 1
          fi
          size=$(stat -c%s "$binary")
          if [ "$size" -gt $((128 * 1024 * 1024)) ]; then
            echo "::error::${{ matrix.target }} 的 deepcore 为 $size 字节，超过 128 MiB 安装上限"
            exit 1
          fi

          mkdir -p dist
          tar -czf "dist/${{ matrix.archive }}.tar.gz" -C "target/${{ matrix.target }}/release" deepcore

      - name: Upload core artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build, core]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate core manifest
        shell: bash
        run: |
          cd dist
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' ../Cargo.toml | head -n1)
          x86_sha=$(sha256sum deepcore-linux-x86_64.tar.gz | awk '{print $1}')
          arm_sha=$(sha256sum deepcore-linux-aarch64.tar.gz | awk '{print $1}')
          base="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          cat > deepcore-manifest.json <<EOF
          {
            "version": "$version",
            "targets": {
              "linux-x86_64": {
                "url": "$base/deepcore-linux-x86_64.tar.gz",
                "sha256": "$x86_sha"
              },
              "linux-aarch64": {
                "url": "$base/deepcore-linux-aarch64.tar.gz",
                "sha256": "$arm_sha"
              }
            }
          }
          EOF

          # manifest 本身也要进校验清单，避免发布后文件被静默替换。
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' \
            | sort \
            | xargs sha256sum > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
