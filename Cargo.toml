[package]
name = "deepterm"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
build = "build.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "ac099b4a809a564f06907125e7a536c33cb60084" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 手写配置文件里的注释与尾逗号（与 Zed 用同一个 crate）。
serde_json_lenient = "0.2"
serde_repr = "0.1"
schemars = "1.0"
enum-iterator = "2.1"
rust-embed = { version = "8.0", features = ["include-flate", "include-exclude"] }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }

# Terminal dependencies
alacritty_terminal = "0.26"
parking_lot = "0.12"
async-channel = "2.0"
itertools = "0.13"
futures = "0.3"
smol = "2.0"
# 本地 PTY 读线程用 poller 同时等待 PTY 主设备 fd 与子进程 SIGCHLD fd
# （alacritty 的 EventLoop 内部同款依赖，此处需直接引用其 poller 类型）。
polling = "3.11"

# SSH dependencies
bytes = "1"
russh-sftp = "2.1.1"
async-trait = "0.1"

# Credential storage (for secure password/key storage)
keyring = { version = "3.6", features = ["apple-native"] }

# Async runtime compatibility
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "io-util",
    "fs",
    "net",
    "sync",
    "time",
] }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1.0"

# File encoding detection / conversion (GBK, GB18030, UTF-16, BOM)
encoding_rs = "0.8"

# Image / SVG preview
image = "0.25.1"
usvg = "0.46.0"
# Kitty 图形协议 `o=z` 负载解压（zlib/DEFLATE 流；已在依赖树中，显式声明）
flate2 = "1"

# Markdown
pulldown-cmark = "0.12"

# Utility
memchr = "2"
uuid = { version = "1.0", features = ["v4"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
notify = "7"
aho-corasick = "1"
toml_edit = "0.22"
# 敏感内存清零（口令/私钥字节），防堆内存残留与 core dump 泄露
zeroize = "1"

# Code Editor
ropey = { version = "2.0.0-beta.1", features = [
    "metric_lines_lf",
    "metric_utf16",
    # char 度量：让 char <-> byte 互转走 O(log N) 的树查询，而不是逐字符累加。
    # masked 输入框在 paint 路径（`masked_display_offset`）和每次 `on_drag_move`
    # 都要做这个转换。
    "metric_chars",
] }
sum-tree = { version = "0.2.0", package = "zed-sum-tree" }
smallvec = "1"
tree-sitter = "0.25"
streaming-iterator = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5"
tree-sitter-bash = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.23"
tree-sitter-toml-ng = "0.7"
tree-sitter-lua = "0.5"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-zig = "1.1"
tree-sitter-make = "1.1.1"
regex = "1.12.3"
imara-diff = "0.1.8"
open = "5"
tree-sitter-yaml = "0.7"
tree-sitter-java = "0.23"
tree-sitter-xml = "0.7"
merman = { version = "0.7.0", features = ["render"] }
# 项目级搜索与模糊查找器的文件遍历层：尊重 .gitignore/.ignore 的并行 walker。
# 不用 walkdir 自己实现——忽略规则的层级语义（父目录规则约束子目录、
# 白名单 `!` 反选、`.git/info/exclude`、全局 gitignore）极易写错。
ignore = "0.4.32"

# 语言服务器协议（LSP）：类型定义 + 客户端实现所需的 JSON-RPC 编解码。
# 0.95 是最后一个用 `url::Url` 的版本——`Url::from_file_path`/`to_file_path`
# 是路径与 URI 互转的可靠入口；0.96+ 换成 `fluent_uri::Uri`（无文件路径
# 转换），自行实现容易在 Windows 盘符与 UNC 上出错。能力结构体名也在
# 0.96 后有变动，故锁定 0.95。
lsp-types = "0.95.1"
# 异步子进程：语言服务器以 stdio 管道通信，需要 `Command`/`Child` 的
# 异步版本以在后台线程驱动读写循环（smol 已在依赖树内，版本与其对齐）。
async-process = "2"
# 异步互斥锁：写语言服务器 stdin 需跨 `await` 持锁，而 `parking_lot` 的
# guard 不是 `Send`，会让承载它的 future 无法送进后台执行器。
async-lock = "3"

# mimalloc 只在非 Windows 上启用。
#
# 真实原因是**构建机的 cargo 源码路径不能含非 ASCII 字符**：`libmimalloc-sys`
# 用 `cc` 编译 vendored C 源码，而 MSVC 的 `cl.exe` 打不开含中文的路径
# （实测 `C:\Users\<中文名>\...` → `c1xx: fatal error C1083: 无法打开源文件`）。
# 同一份源码放在纯 ASCII 路径下用 MSVC 编译是**成功**的，所以这不是 mimalloc
# 缺 Windows 产物，而是工具链的路径限制。
#
# 因此这层 gate 是「让本机/中文路径的 Windows 构建能过」的必要绕行：它对
# 最终用户无影响（发布产物本就不含编译期依赖），代价只是 Windows 端退回系统
# 分配器。若构建路径改为纯 ASCII（例如 `CARGO_HOME=C:\cargo`），可以把这层
# gate 去掉、恢复 Windows 上的 mimalloc。
[target.'cfg(not(target_os = "windows"))'.dependencies]
mimalloc = "0.1.52"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
russh = "0.61.1"

[target.'cfg(windows)'.dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "ac099b4a809a564f06907125e7a536c33cb60084", features = [
    "windows-manifest",
] }
windows = { version = "0.52", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    # 读他进程 cwd（`utils::win_process_cwd`）：OpenProcess / ReadProcessMemory /
    # IsWow64Process 在 Threading 与 Diagnostics::Debug 下，NtQueryInformationProcess
    # 属于 WDK 的 System::Threading；`PROCESS_BASIC_INFORMATION` 结构本身挂在
    # `Win32_System_Kernel` 后面。
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Wdk_System_Threading",
] }
russh = { version = "0.61.1", default-features = false, features = [
    "flate2",
    "ring",
    "rsa",
] }

[target.'cfg(windows)'.dependencies.gpui_platform]
git = "https://github.com/zed-industries/zed.git"
rev = "ac099b4a809a564f06907125e7a536c33cb60084"

[target.'cfg(target_os = "linux")'.dependencies]
fontconfig = "0.10"
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "ac099b4a809a564f06907125e7a536c33cb60084", features = [
    "wayland",
    "x11",
] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "ac099b4a809a564f06907125e7a536c33cb60084", features = [
    "font-kit",
] }
mach2 = "0.4"

# [patch."https://github.com/zed-industries/zed.git"]
# gpui = { path = "../zed/crates/gpui" }
# gpui_macos = { path = "../zed/crates/gpui_macos" }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "ac099b4a809a564f06907125e7a536c33cb60084", features = ["test-support", "bench-support"] }
criterion = { version = "0.5", features = ["html_reports"] }

# #[gpui::bench] 生成的代码调用 gpui_platform::current_headless_renderer，
# 需要 bench-support（仅 test/bench 构建参与特性合并，不影响正式产物）。
#
# 该依赖必须是**全平台**的：非 macOS 上 `current_headless_renderer` 返回 `None`
# （无头渲染器只有 Metal），gpui 会跳过 present —— prepaint/paint 路径仍可测量。
# 只在 macOS 声明会让 `cargo check --all-targets` 在 windows/linux 上直接失败。
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "ac099b4a809a564f06907125e7a536c33cb60084", features = [
    "bench-support",
] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "ac099b4a809a564f06907125e7a536c33cb60084", features = [
    "font-kit",
] }

[package.metadata.bundle]
name = "DeepTerm"
identifier = "com.deepterm.app"
icon = ["assets/icon.png"]
version = "0.1.0"
resources = ["assets"]
copyright = "Copyright (c) 2024"
category = "Developer Tool"
short_description = "A modern terminal emulator"
long_description = """
DeepTerm is a modern terminal emulator built with Rust and GPUI.
Supports local terminals and SSH remote connections.
"""

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2"

[features]
default = ["tree-sitter-languages"]
tree-sitter-languages = []
# 启用 src/utils/alloc_probe（计数分配器 + footprint 探针）。
# bench target 需要独立启用：dev-dependencies 的 cfg(test) 不作用于其代码。
alloc-probe = []

[[bin]]
name = "deepterm"
path = "src/main.rs"

[[bench]]
name = "terminal_render"
harness = false

[[bench]]
name = "markdown_live"
harness = false
