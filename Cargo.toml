[package]
name = "deepterm"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
build = "build.rs"
repository = "https://github.com/cherryicake/deepterm"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "d25fa01ccd788d812f236810b71af4feff6b2e38" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 手写配置文件里的注释与尾逗号（与 Zed 用同一个 crate）。
serde_json_lenient = "0.2"
serde_repr = "0.1"
schemars = "1.0"
enum-iterator = "2.1"
rust-embed = { version = "8.0", features = ["include-flate", "include-exclude"] }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }

# Terminal dependencies
alacritty_terminal = "0.26"
parking_lot = "0.12"
async-channel = "2.0"
# LSP 菜单里显示服务器进程的内存占用（与 Zed `lsp_button.rs` 同源）。
# 已经在依赖图里（zed-scap 传递依赖），直接引用不会多编译一个 crate。
sysinfo = "0.31"
itertools = "0.13"
futures = "0.3"
smol = "2.0"
# 本地 PTY 读线程用 poller 同时等待 PTY 主设备 fd 与子进程 SIGCHLD fd
# （alacritty 的 EventLoop 内部同款依赖，此处需直接引用其 poller 类型）。
polling = "3.11"

# SSH dependencies
bytes = "1"
russh-sftp = "2.1.1"
# 远端 LSP 用：russh channel 的读写是 `tokio::io::AsyncRead/AsyncWrite`，
# 而 LSP 的帧循环基于 `futures` 的同名 trait。`compat` 提供两个方向的
# 桥接。该 crate 已在依赖树里（russh-sftp 传递引入），开 feature 不新增
# 编译单元，只需重编它自己。
tokio-util = { version = "0.7", features = ["compat"] }

# Credential storage (for secure password/key storage)
#
# feature 按平台显式声明各自的后端：macOS 是 Keychain、Windows 是 Credential
# Manager、linux 是 freedesktop Secret Service（GNOME Keyring / KWallet 的共同
# 后端）。Linux 远端 core 是静态 musl 产物，不能链接系统 libdbus；
# `async-secret-service` 走纯 Rust 的 zbus，保持同一套 Secret Service
# 语义与同步 `Entry` API，同时不把系统 C 库带进 core 发布包。
#
# 注意这不是「漏了某个平台就一定不能用」——实测 keyring 3.6 在 Windows 上即使
# 只开 `apple-native` 也能正常读写 Credential Manager（库内有兜底）。显式列出
# 的价值在于两点：一是 linux 侧确实需要一个真实后端（`linux-native` 是
# keyutils，属于**会话级**内存键环、重启即失，承担不了「记住 SSH 密码」，所以
# 选 Secret Service）；二是让依赖关系写在明面上，而不是依赖库的隐式兜底行为。
keyring = { version = "3.6", default-features = false, features = [
    "apple-native",
    "windows-native",
    "async-secret-service",
    "async-io",
    "crypto-rust",
] }

# Async runtime compatibility
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "io-util",
    "fs",
    "net",
    "sync",
    "time",
] }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1.0"

# File encoding detection / conversion (GBK, GB18030, UTF-16, BOM)
encoding_rs = "0.8"

# Image / SVG preview
image = "0.25.1"
usvg = "0.46.0"
# Kitty 图形协议 `o=z` 负载解压（zlib/DEFLATE 流；已在依赖树中，显式声明）
flate2 = "1"

# Markdown
pulldown-cmark = "0.12"
# Markdown 远程图片：同步 HTTP(S) 客户端。默认 feature 是 `rustls`（ring 加密
# 后端 + 内置根证书，纯 Rust，不依赖系统 OpenSSL/SChannel）与 `gzip`。
# 只用于 markdown 图片加载，不参与启动路径。
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip"] }

# 远端 core 发布包：manifest 里带 SHA-256，下载后必须在本地校验通过
# 才允许上传；tar 只用于从固定布局的 release archive 中取出 deepcore。
sha2 = "0.10"
tar = { version = "0.4", default-features = false }

# Utility
memchr = "2"
uuid = { version = "1.0", features = ["v4"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
notify = "7"
aho-corasick = "1"
toml_edit = "0.22"
# 敏感内存清零（口令/私钥字节），防堆内存残留与 core dump 泄露
zeroize = "1"

# Code Editor
ropey = { version = "2.0.0-beta.1", features = [
    "metric_lines_lf",
    "metric_utf16",
    # char 度量：让 char <-> byte 互转走 O(log N) 的树查询，而不是逐字符累加。
    # masked 输入框在 paint 路径（`masked_display_offset`）和每次 `on_drag_move`
    # 都要做这个转换。
    "metric_chars",
] }
sum-tree = { version = "0.2.0", package = "zed-sum-tree" }
smallvec = "1"
tree-sitter = "0.25"
streaming-iterator = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5"
tree-sitter-bash = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.23"
tree-sitter-toml-ng = "0.7"
tree-sitter-lua = "0.5"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-zig = "1.1"
tree-sitter-make = "1.1.1"
regex = "1.12.3"
imara-diff = "0.1.8"
open = "5"
tree-sitter-yaml = "0.7"
tree-sitter-java = "0.23"
tree-sitter-xml = "0.7"
merman = { version = "0.7.0", features = ["render"] }
# 项目级搜索与模糊查找器的文件遍历层：尊重 .gitignore/.ignore 的并行 walker。
# 不用 walkdir 自己实现——忽略规则的层级语义（父目录规则约束子目录、
# 白名单 `!` 反选、`.git/info/exclude`、全局 gitignore）极易写错。
ignore = "0.4.32"

# 语言服务器协议（LSP）：类型定义 + 客户端实现所需的 JSON-RPC 编解码。
# 0.95 是最后一个用 `url::Url` 的版本——`Url::from_file_path`/`to_file_path`
# 是路径与 URI 互转的可靠入口；0.96+ 换成 `fluent_uri::Uri`（无文件路径
# 转换），自行实现容易在 Windows 盘符与 UNC 上出错。能力结构体名也在
# 0.96 后有变动，故锁定 0.95。
lsp-types = "0.95.1"
# 异步子进程：语言服务器以 stdio 管道通信，需要 `Command`/`Child` 的
# 异步版本以在后台线程驱动读写循环（smol 已在依赖树内，版本与其对齐）。
async-process = "2"
# 异步互斥锁：写语言服务器 stdin 需跨 `await` 持锁，而 `parking_lot` 的
# guard 不是 `Send`，会让承载它的 future 无法送进后台执行器。
async-lock = "3"

# mimalloc 只在非 Windows 上启用。
#
# 真实原因是**构建机的 cargo 源码路径不能含非 ASCII 字符**：`libmimalloc-sys`
# 用 `cc` 编译 vendored C 源码，而 MSVC 的 `cl.exe` 打不开含中文的路径
# （实测 `C:\Users\<中文名>\...` → `c1xx: fatal error C1083: 无法打开源文件`）。
# 同一份源码放在纯 ASCII 路径下用 MSVC 编译是**成功**的，所以这不是 mimalloc
# 缺 Windows 产物，而是工具链的路径限制。
#
# 因此这层 gate 是「让本机/中文路径的 Windows 构建能过」的必要绕行：它对
# 最终用户无影响（发布产物本就不含编译期依赖），代价只是 Windows 端退回系统
# 分配器。若构建路径改为纯 ASCII（例如 `CARGO_HOME=C:\cargo`），可以把这层
# gate 去掉、恢复 Windows 上的 mimalloc。
[target.'cfg(not(target_os = "windows"))'.dependencies]
mimalloc = "0.1.52"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
russh = "0.61.1"

[target.'cfg(windows)'.dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "d25fa01ccd788d812f236810b71af4feff6b2e38", features = [
    "windows-manifest",
] }
windows = { version = "0.52", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    # 读他进程 cwd（`utils::win_process_cwd`）：OpenProcess / ReadProcessMemory /
    # IsWow64Process 在 Threading 与 Diagnostics::Debug 下，NtQueryInformationProcess
    # 属于 WDK 的 System::Threading；`PROCESS_BASIC_INFORMATION` 结构本身挂在
    # `Win32_System_Kernel` 后面。
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Wdk_System_Threading",
    # 守护进程的 IPC 在 Windows 上走命名管道（`daemon::windows`）：
    # CreateNamedPipeW / ConnectNamedPipe 在 Pipes，CreateFileW / ReadFile /
    # WriteFile 在 Storage::FileSystem。
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    # 命名管道的读写要用 OVERLAPPED 参数（这里传 None），CreateFileW 与
    # CreateNamedPipeW 的安全描述符指针在 Security 下。
    "Win32_System_IO",
    "Win32_Security",
] }
russh = { version = "0.61.1", default-features = false, features = [
    "flate2",
    "ring",
    "rsa",
] }

[target.'cfg(windows)'.dependencies.gpui_platform]
git = "https://github.com/zed-industries/zed.git"
rev = "d25fa01ccd788d812f236810b71af4feff6b2e38"

[target.'cfg(target_os = "linux")'.dependencies]
fontconfig = "0.10"
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "d25fa01ccd788d812f236810b71af4feff6b2e38", features = [
    "wayland",
    "x11",
] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "d25fa01ccd788d812f236810b71af4feff6b2e38", features = [
    "font-kit",
] }
mach2 = "0.4"

# [patch."https://github.com/zed-industries/zed.git"]
# gpui = { path = "../zed/crates/gpui" }
# gpui_macos = { path = "../zed/crates/gpui_macos" }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "d25fa01ccd788d812f236810b71af4feff6b2e38", features = ["test-support", "bench-support"] }
criterion = { version = "0.8.2", features = ["html_reports"] }

# #[gpui::bench] 生成的代码调用 gpui_platform::current_headless_renderer，
# 需要 bench-support（仅 test/bench 构建参与特性合并，不影响正式产物）。
#
# 该依赖必须是**全平台**的：非 macOS 上 `current_headless_renderer` 返回 `None`
# （无头渲染器只有 Metal），gpui 会跳过 present —— prepaint/paint 路径仍可测量。
# 只在 macOS 声明会让 `cargo check --all-targets` 在 windows/linux 上直接失败。
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "d25fa01ccd788d812f236810b71af4feff6b2e38", features = [
    "bench-support",
] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "d25fa01ccd788d812f236810b71af4feff6b2e38", features = [
    "font-kit",
] }

# 注意：必须写在 `bin.deepterm` 下。
#
# 本包有两个二进制（GUI 与守护进程）。`cargo bundle --bin deepterm` 在
# cargo-bundle 0.9 里**只读** `[package.metadata.bundle.bin.deepterm]`，
# 找不到就套默认值（名字变成 deepterm、identifier 变成 deepterm.deepterm、
# 图标与资源全部丢失，Finder/Dock 里就是一个空白图标）。顶层
# `[package.metadata.bundle]` 只对不带 `--bin` 的调用生效，而那种调用会
# 选中另一个二进制 deepcore 当主程序——同样不可用。因此元数据只放这里，
# 打包必须显式 `cargo bundle --release --bin deepterm`（见 build-dmg.sh）。
[package.metadata.bundle.bin.deepterm]
name = "DeepTerm"
identifier = "com.deepterm.app"
icon = ["assets/icon.png"]
version = "0.1.0"
resources = ["assets"]
copyright = "Copyright (c) 2024"
category = "Developer Tool"
short_description = "A modern terminal emulator"
long_description = """
DeepTerm is a modern terminal emulator built with Rust and GPUI.
Supports local terminals and SSH remote connections.
"""

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2"

[features]
# 启用 src/utils/alloc_probe（计数分配器 + footprint 探针）。
# bench target 需要独立启用：dev-dependencies 的 cfg(test) 不作用于其代码。
alloc-probe = []

# GUI 客户端。
[[bin]]
name = "deepterm"
path = "src/bin/deepterm.rs"

# 终端守护进程：独立进程，持有所有 PTY，让终端活过窗口关闭。
# 单独一个二进制而不是 `deepterm __daemon` 的理由见 src/bin/deepcore.rs 顶部。
[[bin]]
name = "deepcore"
path = "src/bin/deepcore.rs"

[[bench]]
name = "terminal_render"
harness = false

[[bench]]
name = "markdown_live"
harness = false

# ── Lint 门槛 ────────────────────────────────────────────────────────────────
#
# 这些不是「一次性清理」的记录，而是防止回归的护栏：清理前全仓有 172 条
# clippy 警告（含 70 个参数过多的函数、26 处没有 SAFETY 注释的 `unsafe` 块、
# 8 处模块同名、19 处复杂类型）。已清零的类别设为 `deny`，新代码就不能再往
# 同一个坑里掉。
[lints.clippy]
# 一个函数超过 7 个参数通常意味着参数该打包成结构体（本轮已用
# `RowCtx` / `TransferCtx` / `AttachableParts` / `CellBox` / `PayloadSpec`
# 等消掉 62 处）。余下 8 处是历史遗留（UI 构建、绘制辅助、脚本式传输函数），
# 逐个改会伤可读性，因此暂时只报不拦；新增的同类函数会在 CI 里直接看到。
too_many_arguments = "warn"
# 下面这些已全部清零，设成 deny 防止回归。
module_inception = "deny"
type_complexity = "deny"
single_range_in_vec_init = "deny"
if_same_then_else = "deny"
only_used_in_recursion = "deny"
items_after_test_module = "deny"
unnecessary_get_then_check = "deny"
needless_borrow = "deny"
needless_return = "deny"
manual_contains = "deny"
manual_repeat_n = "deny"
derivable_impls = "deny"
redundant_locals = "deny"
needless_update = "deny"
unnecessary_map_or = "deny"
while_let_loop = "deny"
single_match = "deny"
useless_format = "deny"
needless_lifetimes = "deny"
clone_on_copy = "deny"
chunks_exact_to_as_chunks = "deny"
doc_lazy_continuation = "deny"
assertions_on_constants = "deny"

# ── 发布构建 ────────────────────────────────────────────────────────────────
#
# 打包脚本用的是 `cargo build --release`，此前没有显式 profile，等于用默认
# （thin-local LTO 关闭、16 个 codegen unit、不 strip）。启动时间与体积都吃亏。
#
# **不要设 `panic = "abort"`**：`file_manager/upload_download.rs` 的上传 worker
# 与 `ssh/lsp_channel.rs` 的 channel 析构依赖 `catch_unwind` 把 panic 降级成
# 错误结果；abort 会让进程直接死掉——那正是这两处防御要避免的场景。
[profile.release]
# thin LTO：跨 crate 内联（gpui 的 hot path 大多在依赖里），编译时间可控。
lto = "thin"
# 单一 codegen unit：release 才有的最佳优化，代价是全量重编（打包脚本本来
# 就是干净构建）。
codegen-units = 1
# 调试符号不随产物分发（体积明显变小）。代价是崩溃栈只有地址；需要符号化时
# 用 `cargo build --release` 重编一次带 debuginfo 的版本，或临时注释本行。
strip = "debuginfo"
