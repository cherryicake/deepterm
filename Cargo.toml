[package]
name = "deepterm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
build = "build.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "35eaeb94a7e5e9dcd7384df4bd21f01c30a38a09" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
schemars = "1.0"
tracing = "0.1"
enum-iterator = "2.1"
rust-embed = { version = "8.0", features = ["include-flate", "include-exclude"] }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }

# Terminal dependencies
alacritty_terminal = "0.26"
parking_lot = "0.12"
async-channel = "2.0"
itertools = "0.13"
futures = "0.3"
smol = "2.0"

# SSH dependencies
bytes = "1"
russh-sftp = "2.1.1"
async-trait = "0.1"

# Credential storage (for secure password/key storage)
keyring = { version = "3.6", features = ["apple-native"] }

# Async runtime compatibility
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "io-util",
    "fs",
    "net",
    "sync",
    "time",
] }
async-process = "2.3"
async-io = "2.4"

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1.0"

# Image / SVG preview
image = "0.25.1"
usvg = "0.46.0"

# Markdown
pulldown-cmark = "0.12"

# Utility
memchr = "2"
rand = "0.8"
uuid = { version = "1.0", features = ["v4"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
notify = "7"
aho-corasick = "1"

# Code Editor
ropey = { version = "2.0.0-beta.1", features = [
    "metric_lines_lf",
    "metric_utf16",
] }
sum-tree = { version = "0.2.0", package = "zed-sum-tree" }
smallvec = "1"
tree-sitter = "0.25"
streaming-iterator = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5"
tree-sitter-bash = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.23"
tree-sitter-toml-ng = "0.7"
tree-sitter-lua = "0.5"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-zig = "1.1"
tree-sitter-make = "1.1.1"
regex = "1.12.3"
imara-diff = "0.1.8"
open = "5"
mimalloc = "0.1.52"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
russh = "0.61.1"

[target.'cfg(windows)'.dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "35eaeb94a7e5e9dcd7384df4bd21f01c30a38a09", features = [
    "windows-manifest",
] }
windows = { version = "0.52", features = [
    "Win32_System_Console",
    "Win32_Foundation",
] }
russh = { version = "0.61.1", default-features = false, features = [
    "flate2",
    "ring",
    "rsa",
] }

[target.'cfg(windows)'.dependencies.gpui_platform]
git = "https://github.com/zed-industries/zed.git"
rev = "35eaeb94a7e5e9dcd7384df4bd21f01c30a38a09"

[target.'cfg(target_os = "linux")'.dependencies]
fontconfig = "0.10"
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "35eaeb94a7e5e9dcd7384df4bd21f01c30a38a09", features = [
    "wayland",
    "x11",
] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "35eaeb94a7e5e9dcd7384df4bd21f01c30a38a09", features = [
    "font-kit",
] }
mach2 = "0.4"

# [patch."https://github.com/zed-industries/zed.git"]
# gpui = { path = "../zed/crates/gpui" }
# gpui_macos = { path = "../zed/crates/gpui_macos" }

[package.metadata.bundle]
name = "DeepTerm"
identifier = "com.deepterm.app"
icon = ["assets/icon.png"]
version = "0.1.0"
resources = ["assets"]
copyright = "Copyright (c) 2024"
category = "Developer Tool"
short_description = "A modern terminal emulator"
long_description = """
DeepTerm is a modern terminal emulator built with Rust and GPUI.
Supports local terminals and SSH remote connections.
"""

[build-dependencies]
embed-resource = "2"

[features]
default = ["tree-sitter-languages"]
tree-sitter-languages = []

[[bin]]
name = "deepterm"
path = "src/main.rs"
