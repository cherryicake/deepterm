[package]
name = "deepterm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust-embed = { version = "8.0", features = ["include-flate"] }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }

# Terminal dependencies
alacritty_terminal = "0.24"
parking_lot = "0.12"
async-channel = "2.0"
itertools = "0.13"
futures = "0.3"
smol = "2.0"

# SSH dependencies
russh = { path = "../russh/russh" }
bytes = "1"
russh-sftp = "2.1.1"
async-trait = "0.1"

# Credential storage (for secure password/key storage)
keyring = { version = "3.6", features = ["apple-native"] }

# Async runtime compatibility
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "fs", "net", "sync", "time"] }
async-process = "2.3"
async-io = "2.4"

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1.0"

# Utility
memchr = "2"
rand = "0.8"
uuid = { version = "1.0", features = ["v4"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_System_Console",
    "Win32_Foundation",
] }

[target.'cfg(windows)'.dependencies.gpui_platform]
git = "https://github.com/zed-industries/zed.git"

[target.'cfg(target_os = "linux")'.dependencies]
fontconfig = "0.10"
gpui_platform = { git = "https://github.com/zed-industries/zed.git", features = [
    "wayland",
    "x11",
] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed.git", features = [
    "font-kit",
] }
mach2 = "0.4"

# [patch."https://github.com/zed-industries/zed.git"]
# gpui = {path = "../zed/crates/gpui"}
# gpui_macos = {path = "../zed/crates/gpui_macos"}

[package.metadata.bundle]
name = "DeepTerm"
identifier = "com.deepterm.app"
icon = ["assets/icon.png"]
version = "0.1.0"
resources = ["assets"]
copyright = "Copyright (c) 2024"
category = "Developer Tool"
short_description = "A modern terminal emulator"
long_description = """
DeepTerm is a modern terminal emulator built with Rust and GPUI.
Supports local terminals and SSH remote connections.
"""

[[bin]]
name = "deepterm"
path = "src/main.rs"
