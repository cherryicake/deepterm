[package]
name = "gpui-dock-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
gpui = { path = "../zed/crates/gpui" }
gpui_platform = { path = "../zed/crates/gpui_platform", features = ["wayland", "x11"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "gpui-dock-demo"
path = "src/main.rs"
