[package]
name = "deepterm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }

# Terminal dependencies
alacritty_terminal = "0.24"
parking_lot = "0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Win32_System_Console", "Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed.git", features = ["wayland", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed.git", features = ["font-kit"] }
mach2 = "0.4"

[[bin]]
name = "deepterm"
path = "src/main.rs"
