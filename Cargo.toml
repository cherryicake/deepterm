[package]
name = "deepterm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
build = "build.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "ac099b4a809a564f06907125e7a536c33cb60084" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
schemars = "1.0"
enum-iterator = "2.1"
rust-embed = { version = "8.0", features = ["include-flate", "include-exclude"] }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }

# Terminal dependencies
alacritty_terminal = "0.26"
parking_lot = "0.12"
async-channel = "2.0"
itertools = "0.13"
futures = "0.3"
smol = "2.0"

# SSH dependencies
bytes = "1"
russh-sftp = "2.1.1"
async-trait = "0.1"

# Credential storage (for secure password/key storage)
keyring = { version = "3.6", features = ["apple-native"] }

# Async runtime compatibility
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "io-util",
    "fs",
    "net",
    "sync",
    "time",
] }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1.0"

# File encoding detection / conversion (GBK, GB18030, UTF-16, BOM)
encoding_rs = "0.8"

# Image / SVG preview
image = "0.25.1"
usvg = "0.46.0"

# Markdown
pulldown-cmark = "0.12"

# Utility
memchr = "2"
uuid = { version = "1.0", features = ["v4"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
notify = "7"
aho-corasick = "1"
# 敏感内存清零（口令/私钥字节），防堆内存残留与 core dump 泄露
zeroize = "1"

# Code Editor
ropey = { version = "2.0.0-beta.1", features = [
    "metric_lines_lf",
    "metric_utf16",
    # char 度量：让 char <-> byte 互转走 O(log N) 的树查询，而不是逐字符累加。
    # masked 输入框在 paint 路径（`masked_display_offset`）和每次 `on_drag_move`
    # 都要做这个转换。
    "metric_chars",
] }
sum-tree = { version = "0.2.0", package = "zed-sum-tree" }
smallvec = "1"
tree-sitter = "0.25"
streaming-iterator = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5"
tree-sitter-bash = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.23"
tree-sitter-toml-ng = "0.7"
tree-sitter-lua = "0.5"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-zig = "1.1"
tree-sitter-make = "1.1.1"
regex = "1.12.3"
imara-diff = "0.1.8"
open = "5"
mimalloc = "0.1.52"
tree-sitter-yaml = "0.7"
tree-sitter-java = "0.23"
tree-sitter-xml = "0.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
russh = "0.61.1"

[target.'cfg(windows)'.dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "ac099b4a809a564f06907125e7a536c33cb60084", features = [
    "windows-manifest",
] }
windows = { version = "0.52", features = [
    "Win32_System_Console",
    "Win32_Foundation",
] }
russh = { version = "0.61.1", default-features = false, features = [
    "flate2",
    "ring",
    "rsa",
] }

[target.'cfg(windows)'.dependencies.gpui_platform]
git = "https://github.com/zed-industries/zed.git"
rev = "ac099b4a809a564f06907125e7a536c33cb60084"

[target.'cfg(target_os = "linux")'.dependencies]
fontconfig = "0.10"
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "ac099b4a809a564f06907125e7a536c33cb60084", features = [
    "wayland",
    "x11",
] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "ac099b4a809a564f06907125e7a536c33cb60084", features = [
    "font-kit",
] }
mach2 = "0.4"

# [patch."https://github.com/zed-industries/zed.git"]
# gpui = { path = "../zed/crates/gpui" }
# gpui_macos = { path = "../zed/crates/gpui_macos" }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "ac099b4a809a564f06907125e7a536c33cb60084", features = ["test-support", "bench-support"] }
criterion = { version = "0.5", features = ["html_reports"] }

# #[gpui::bench] 生成的代码调用 gpui_platform::current_headless_renderer，
# 需要 bench-support（仅 test/bench 构建参与特性合并，不影响正式产物）。
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "ac099b4a809a564f06907125e7a536c33cb60084", features = [
    "font-kit",
    "bench-support",
] }

[package.metadata.bundle]
name = "DeepTerm"
identifier = "com.deepterm.app"
icon = ["assets/icon.png"]
version = "0.1.0"
resources = ["assets"]
copyright = "Copyright (c) 2024"
category = "Developer Tool"
short_description = "A modern terminal emulator"
long_description = """
DeepTerm is a modern terminal emulator built with Rust and GPUI.
Supports local terminals and SSH remote connections.
"""

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2"

[features]
default = ["tree-sitter-languages"]
tree-sitter-languages = []
# 启用 src/utils/alloc_probe（计数分配器 + footprint 探针）。
# bench target 需要独立启用：dev-dependencies 的 cfg(test) 不作用于其代码。
alloc-probe = []

[[bin]]
name = "deepterm"
path = "src/main.rs"

[[bench]]
name = "terminal_render"
harness = false
