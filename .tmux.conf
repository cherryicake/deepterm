# =============================================
# DeepTerm Tmux 配置文件
# =============================================
# 使用方法:
# 1. 复制此文件到 ~/.tmux.conf
# 2. 运行: tmux source-file ~/.tmux.conf
# 3. 或者重启 tmux 会话
# =============================================

# 基本设置
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g history-limit 100000

# =============================================
# 剪贴板集成 - OSC 52 (DeepTerm 支持)
# =============================================
# 启用 OSC 52 剪贴板集成
set -g set-clipboard on

# 允许转义序列通过
set -g allow-passthrough on

# =============================================
# 复制模式设置
# =============================================
# 使用 vi 风格的快捷键
setw -g mode-keys vi

# 鼠标选择后自动复制到剪贴板
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# 键盘快捷键复制
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Y send-keys -X copy-end-of-line-and-cancel

# 双击选择单词，三击选择行
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line

# =============================================
# 窗口和面板管理
# =============================================
# 窗口和面板索引从 1 开始
set -g base-index 1
setw -g pane-base-index 1

# 自动重新编号窗口
set -g renumber-windows on

# 重新加载配置快捷键
bind r source-file ~/.tmux.conf \; display "配置已重新加载!"

# 窗口管理
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# 面板导航 (使用 Alt + 方向键)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# 窗口切换 (使用 Shift + 方向键)
bind -n S-Left previous-window
bind -n S-Right next-window

# =============================================
# 状态栏设置
# =============================================
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100

# 状态栏样式
set -g status-style bg=colour235,fg=colour250
set -g window-status-current-style bg=colour39,fg=colour255,bold
set -g window-status-style bg=colour235,fg=colour250

# 状态栏内容
set -g status-left " #[fg=colour39,bold]#S #[default]"
set -g status-right " #[fg=colour250]%Y-%m-%d %H:%M #[fg=colour39,bold]#h "

# =============================================
# 其他有用的设置
# =============================================
# 减少延迟
set -sg escape-time 10
set -g repeat-time 600

# 启用焦点事件
set -g focus-events on

#  aggressive resize
setw -g aggressive-resize on

# 监视窗口活动
setw -g monitor-activity on
set -g visual-activity off

# 自动命名窗口
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"

# 启用 xterm 键
set -g xterm-keys on

# =============================================
# DeepTerm 特定设置
# =============================================
# 设置 TERM_PROGRAM 以便应用程序识别 DeepTerm
set -ga update-environment " TERM_PROGRAM TERM_PROGRAM_VERSION"

# =============================================
# 提示信息
# =============================================
# 启动时显示提示
display "DeepTerm Tmux 配置已加载! 剪贴板集成已启用"
